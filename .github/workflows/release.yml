name: Release

# The npm trusted publisher for rx-state-bridge is bound to this file name
# (release.yml): renaming it makes every publish fail authentication.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Each job asks for what it needs. Only `publish` holds id-token, so the OIDC
# token that can publish to npm never exists in a job that installs with
# lifecycle scripts, builds, or opens pull requests.
permissions: {}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: npm ci
      # "version" when changesets are pending, "publish" when package.json holds
      # a version npm does not have yet, "none" otherwise.
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog entry names the commit that added each changeset,
          # which a shallow clone does not have.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: npm ci
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm >= 11.5.1; Node 20 bundles npm 10, which
      # fails the OIDC exchange with a misleading 404 instead of an auth error.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false
      - run: npm --version
      # Only the Changesets CLI is needed here: the tarballs come prebuilt from
      # `pack`, so no dependency's install script runs next to the OIDC token.
      - run: npm ci --ignore-scripts
      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
      # npm can report success before the registry serves the new version (1.2.3
      # took about five minutes), and a publish that never landed would also look
      # green. Fail the run unless every published version becomes fetchable.
      - name: Confirm the release reached the registry
        if: steps.publish.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.publish.outputs.published-packages }}
        run: |
          for pkg in $(jq -r '.[] | "\(.name)@\(.version)"' <<< "$PUBLISHED"); do
            name="${pkg%@*}"
            version="${pkg##*@}"
            for attempt in $(seq 1 20); do
              if curl -fsS -o /dev/null "https://registry.npmjs.org/${name}/${version}?nocache=$(date +%s)"; then
                echo "${pkg} is on the registry"
                continue 2
              fi
              sleep 30
            done
            echo "::error::${pkg} was reported as published but is not on the registry after 10 minutes"
            exit 1
          done
