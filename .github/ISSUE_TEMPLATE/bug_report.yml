name: Bug report
description: An operator does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Security issues go through private vulnerability reporting instead, never a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected the state indicators to hold and what they held instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest pipeline that shows the problem, including how the observable is subscribed to and torn down.
      render: ts
    validations:
      required: true
  - type: dropdown
    id: indicator
    attributes:
      label: State primitive
      description: What the operator writes into.
      options:
        - React setState callback
        - Angular WritableSignal
        - Vue ref
        - Another object with a .set() method
        - A plain function
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: rx-state-bridge 1.2.2, rxjs 7.8.1, Angular 20 / React 19
    validations:
      required: true
