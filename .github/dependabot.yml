version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      # Packages that must move in lockstep, or npm ci fails on peer ranges.
      # Dependabot puts a dependency in the first group it matches, so these come
      # before the catch-all: listed after it, their majors matched minor-and-patch
      # first, were filtered out by update-types and arrived one package per PR.
      vitest:
        patterns: [vitest, '@vitest/*']
      typescript-eslint:
        patterns: ['@typescript-eslint/*']
      minor-and-patch:
        update-types: [minor, patch]
      # Groups only cover version updates unless they say otherwise, and a
      # security fix in one of these packages needs its siblings just the same.
      vitest-security:
        applies-to: security-updates
        patterns: [vitest, '@vitest/*']
      typescript-eslint-security:
        applies-to: security-updates
        patterns: ['@typescript-eslint/*']
    ignore:
      # Changesets CLI v3 also needs changesets/action v2; upgrade both by hand.
      - dependency-name: '@changesets/cli'
        update-types: [version-update:semver-major]
      # TypeScript 7 is the native-compiler rewrite, and tsup emits the .d.ts files
      # through the compiler; move to it deliberately, not from a bot pull request.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # The live demo deployed to GitHub Pages; one grouped pull request a week.
  - package-ecosystem: npm
    directory: /examples/react
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      react-example:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    ignore:
      # v2 requires Changesets CLI v3; see the npm entry above.
      - dependency-name: changesets/action
        update-types: [version-update:semver-major]
